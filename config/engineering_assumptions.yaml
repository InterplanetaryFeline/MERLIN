# Engineering assumptions, MER coefficients and property library.
# Every leaf: v=value, u=units, d=description, s=source, t=provenance (user|reference|assumed).
# Page references are PRINTED page numbers of Edberg & Costa, Design of Rockets and Space Launch Vehicles, 2nd ed. (AIAA 2022)
# that were checked against the supplied PDF text (PDF page = printed page + 35).
earth_model: {v: book, u: "-", d: "Earth constants set: 'book' (mu=g0 R^2, R=6378 km) or 'wgs84'", s: "Book p.156 for 'book'; WGS-84 values are supplementary", t: reference}

mer:
  engine_a: {v: 7.81e-4, u: "kg/N", d: "Engine MER coefficient a: m = T(a + b sqrt(eps)) + c", s: "Book Table 8.9 row 1, p.495 (verified by Example 2, p.504: 710 kg)", t: reference}
  engine_b: {v: 3.37e-5, u: "kg/N", d: "Engine MER coefficient b", s: "Book Table 8.9 row 1, p.495", t: reference}
  engine_c: {v: 59.0, u: kg, d: "Engine MER constant c (per engine)", s: "Book Table 8.9 row 1, p.495", t: reference}
  engine_calibration_factor: {v: 1.221, u: "-", d: "Multiplier applied to the Table 8.9 engine mass when engine.mass_method = mer_calibrated. 1.0 reproduces the book exactly", s: "MEASURED (R20), not assumed: a log-space least-squares scale over the 16 database engines that publish a dry mass. The book relation is biased low - 14 of the 16 come out light, median -24 % - and this factor removes that for a typical engine while making the two exceptional ones (Merlin 1D, RD-253) worse. engine_db.mer_check() reproduces it", t: reference}
  gimbal_k: {v: 237.8, u: kg, d: "Gimbal MER coefficient: m = k (T/Pc)^n per engine", s: "Book Table 8.9 row 2, p.495; units verified by p.505 example (162 kg)", t: reference}
  gimbal_exp: {v: 0.9375, u: "-", d: "Gimbal MER exponent n", s: "Book Table 8.9 row 2, p.495", t: reference}
  thrust_structure_k: {v: 2.55e-4, u: "kg/N", d: "Thrust structure mass per total stage thrust", s: "Book Table 8.8 row 3, p.495 (verified: 1,068 kg, p.504)", t: reference}
  unpressurized_kg_m2: {v: 13.3, u: "kg/m^2", d: "Metal unpressurised structure areal mass (skirts, intertanks, interstages, fairing)", s: "Book Table 8.8 row 1, p.495", t: reference}
  composite_fairing_kg_m2: {v: 9.89, u: "kg/m^2", d: "Composite fairing areal mass", s: "Book Table 8.8 row 2, p.495", t: reference}
  paf_a: {v: 0.0755, u: "-", d: "Payload attach fitting: m = a m_PL + b", s: "Book Table 8.8 row 4, p.495 (verified p.505: 805 kg for 10 t)", t: reference}
  paf_b: {v: 50.0, u: kg, d: "PAF constant", s: "Book Table 8.8 row 4, p.495", t: reference}
  paf_small_payload_fraction: {v: 0.15, u: "-", d: "PAF mass / payload mass for small payloads (methods 'fraction' and 'auto')", s: "1st-ed. errata p.443 adds to Table 8.8 item 3: 'Use m_PAF = 0.15 m_PL for smaller payloads'; Table 8.8 row 5 uses the same 0.15 m_PL for mounts below 20 kg", t: reference}
  paf_fraction_payload_threshold_kg: {v: 1000.0, u: kg, d: "Payload mass below which method 'auto' uses the 0.15 m_PL form instead of the MER", s: "Engineering choice: the same 1 T small/large launcher boundary the avionics MER uses (Table 8.8 row 6)", t: assumed}
  avionics_small_kg: {v: 75.0, u: kg, d: "Avionics mass, payload < threshold", s: "Book Table 8.8 row 6, p.495", t: reference}
  avionics_large_kg: {v: 350.0, u: kg, d: "Avionics mass, payload > threshold", s: "Book Table 8.8 row 6, p.495", t: reference}
  avionics_payload_threshold_kg: {v: 1000.0, u: kg, d: "Payload threshold separating small/large launchers (1 T)", s: "Book Table 8.8 row 6, p.495", t: reference}
  avionics_upper_share: {v: 0.8, u: "-", d: "Share of avionics mass in the uppermost stage (rest split equally among lower stages)", s: "Book Table 8.8 row 6, p.495 (80/20 for two stages; equal split among lower stages for >2 is an extension)", t: reference}
  wiring_kg_per_m: {v: 1.43, u: "kg/m", d: "Wiring mass per metre of overall vehicle length, distributed by stage length", s: "Book Table 8.8 row 7, p.495", t: reference}
  tank_vol_mer_kg_m3: {v: 12.16, u: "kg/m^3", d: "Metallic tank mass per contained volume (all propellants except LH2)", s: "Book Table 8.7, p.495", t: reference}
  tank_vol_mer_lh2_kg_m3: {v: 9.09, u: "kg/m^3", d: "Metallic LH2 tank mass per contained volume", s: "Book Table 8.7, p.495", t: reference}
  tank_mer_density_tolerance: {v: 0.10, u: "-", d: "Max relative density deviation allowed when applying a Table 8.6 propellant-mass MER", s: "Engineering choice (MER is valid only at its reference density)", t: assumed}
  shrink_load_temperature_K: {v: 293.0, u: K, d: "Ambient loading temperature used for cryogenic tank shrinkage", s: "Book Table 8.1 'Room Temp.', p.473", t: reference}

