# ---------------------------------------------------------------------------------------------------------
# Propellant combinations: what mixture ratio to run, and what performance is thermochemically available.
#
# A stage may name one instead of spelling out its propellants:
#
#   propellant_combination: {v: "LOX/RP-1", u: '-', d: "...", s: "...", t: user}
#
# which fills `fuel`, `oxidizer` and `mixture_ratio_OF` if the stage does not state them. Anything the stage
# does state wins, exactly as with the engine database.
#
# TWO DIFFERENT MIXTURE RATIOS are carried, because they are not the same number and conflating them is a
# classic way to produce a vehicle that cannot exist:
#   of_ratio_optimum  - the ratio that MAXIMISES Isp, from the book's thermochemistry (Table 4.10, p.240).
#   of_ratio_flight   - what a real engine of that combination actually runs, each one named. Engines run off
#                       the optimum for cooling, turbine temperature, density and tank-volume reasons. For
#                       LOX/LH2 the gap is enormous: peak Isp is near O/F 4.0, and the J-2 flew at 5.50.
# `of_ratio_flight` is what gets filled into a stage, because this tool sizes real vehicles, not ideal ones.
#
# Book reference condition for Isp, c* and Tc (Table 4.10, p.240): chamber pressure 1,000 psia (6.895 MPa),
# optimum expansion to sea-level ambient, adiabatic combustion, isentropic expansion. The book prints each
# combination TWICE - frozen equilibrium (upper row) and shifting equilibrium (lower row); the shifting values
# are carried here and the frozen ones in *_frozen. These are NOT vacuum Isp figures: a vacuum nozzle of large
# area ratio legitimately beats them (RD-180 delivers 338 s vacuum against Table 4.10's 300 s for LOX/RP-1).
# They are an upper bound on what the chemistry can give AT THAT CONDITION, useful for sanity, not a target.
#
# bulk_sg is the book's printed specific gravity of the mixture. The tool recomputes it from the component
# densities and the mixture ratio and checks the two agree - see tests/test_propellant_combinations.py, where
# that check independently confirms the Table 4.6 Aerozine-50 density is a misprint.
propellant_combinations:
  "LOX/LH2":
    oxidizer: {v: LOX, u: '-', d: "Oxidizer key into `propellants`", s: "Book Table 4.10, p.240", t: reference}
    fuel: {v: LH2, u: '-', d: "Fuel key into `propellants`", s: "Book Table 4.10, p.240", t: reference}
    of_ratio_optimum: {v: 4.02, u: '-', d: "O/F at maximum Isp (shifting equilibrium)", s: "Book Table 4.10, p.240", t: reference}
    of_ratio_optimum_frozen: {v: 3.40, u: '-', d: "O/F at maximum Isp (frozen equilibrium)", s: "Book Table 4.10, p.240", t: reference}
    of_ratio_flight: {v: 5.50, u: '-', d: "Flown mixture ratio. Far above the Isp optimum: hydrogen engines run fuel-rich to keep turbine and chamber temperatures down", s: "Book Table 4.12, p.242: Rocketdyne J-2, f = 5.50 +/- 2 % on SA504 and later. Table 4.14 (p.245) gives 6.0 for the SSME and RS-68, 5.3 for HM-60", t: reference}
    isp_ref_s: {v: 391.0, u: s, d: "Theoretical Isp at the book reference condition", s: "Book Table 4.10, p.240", t: reference}
