    isp_note: {v: "Table 4.7 gives Isp 192 s and c* 1,209 m/s", u: "-", d: "Reference performance", s: "Book Table 4.7, p.238", t: reference}
    source: {v: "Edberg & Costa Table 4.7 (p.238)", u: "-", d: "Provenance", s: "Book", t: reference}

tank_materials:
  # THE ALLOWABLE-STRESS BASIS, read this before trading one material against another.
  #
  # sigma_allow_Pa is NOT the published yield strength. The legacy Al-2219 entry below carries 250 MPa
  # against a 395 MPa minimum 0.2 % proof strength for 2219-T87 - a knockdown of 0.633 - described in its
  # own source field as an assumed round number for a preliminary estimate. Every material added since uses
  # THE SAME 0.633 fraction of its own published minimum yield, for one reason: a material trade is only
  # meaningful if each candidate is derated on the same basis. Quoting one material at full yield and
  # another at two thirds of it would decide the trade by bookkeeping rather than by metallurgy.
  #
  # The knockdown is a stand-in for everything a preliminary model does not carry - temperature, weld
  # softening beyond the joint efficiency, fatigue, fracture control, and the difference between a minimum
  # specified property and a design allowable. It is NOT a qualified allowable, and none of these materials
  # is qualified for flight here. The safety_factor below is applied on top of it, not instead of it.
  #
  # Each entry's yield_min_Pa records the published figure the allowable was derated from, so the basis can
  # be checked, and changed, without hunting through datasheets.
  Al-2219:
    name: {v: "Aluminium alloy (generic, 2219-class)", u: "-", d: "Material label", s: "Generic assumption", t: assumed}
    rho_kg_m3: {v: 2840.0, u: "kg/m^3", d: "Density", s: "Typical handbook value (supplementary)", t: assumed}
    alpha_per_K: {v: 23.4e-6, u: "1/K", d: "Coefficient of thermal expansion", s: "Book p.472 (aluminium 23.4e-6 /K)", t: reference}
    sigma_allow_Pa: {v: 250.0e6, u: Pa, d: "Allowable membrane stress at operating temperature (before safety factor)", s: "Assumed round number for a preliminary pressure-vessel estimate; not qualified", t: assumed}
    joint_efficiency: {v: 0.9, u: "-", d: "Weld joint efficiency", s: "Assumed", t: assumed}
    safety_factor: {v: 1.4, u: "-", d: "Factor applied to pressure for sizing", s: "Assumed", t: assumed}
    corrosion_allowance_m: {v: 0.0003, u: m, d: "Manufacturing / chem-mill allowance added to thickness", s: "Assumed", t: assumed}
    t_min_m: {v: 0.0015, u: m, d: "Minimum practical gauge", s: "Assumed", t: assumed}
    E_Pa: {v: 69.0e9, u: Pa, d: "Young's modulus. Needed by the Chapter 10 buckling allowables (Eqs. 10.25, 10.31-10.33), not by the membrane tank sizing", s: "Book Example 2, p.637: E_Al = 69 GPa (10e6 psi)", t: reference}
    poisson: {v: 0.31, u: "-", d: "Poisson ratio. Needed only by the flared-skirt buckling criterion of NASA SP-8019", s: "Book Sec. 10.3.1.1, p.638: 'typically around 0.31'", t: reference}
    t_min_structural_m: {v: 0.0005, u: m, d: "Minimum gauge for a load-carrying skin in the stress analysis. Distinct from t_min_m above, which is the minimum the pressure-vessel tank sizing will accept", s: "Book Table 10.2, p.634: aluminium skin t >= 0.50 mm (0.020 in.)", t: reference}
    yield_min_Pa: {v: 395.0e6, u: Pa, d: "Published minimum 0.2 % proof strength, recorded so the allowable above can be traced to it (250/395 = 0.633)", s: "Matmatch AA 2219-T87: 0.2 % proof 395 MPa typical of the 340-400 MPa range", t: reference}

  SS-301-FH:
    name: {v: "Stainless steel 301, full hard (AMS 5519)", u: "-", d: "Material label", s: "AMS 5519 full-hard sheet", t: reference}
    rho_kg_m3: {v: 7880.0, u: "kg/m^3", d: "Density", s: "Upper Metals AMS 5519 datasheet: 0.2850 lb/in^3 = 7.88 g/cm^3", t: reference}
    alpha_per_K: {v: 17.0e-6, u: "1/K", d: "Coefficient of thermal expansion", s: "MakeItFrom full-hard 301: 17 um/m-K", t: reference}
    sigma_allow_Pa: {v: 611.0e6, u: Pa, d: "Allowable membrane stress before safety factor: 0.633 x minimum yield, the same basis as Al-2219", s: "Derived: 0.633 x 965 MPa (AMS 5519 minimum 0.2 % yield). Not a qualified allowable", t: assumed}
    yield_min_Pa: {v: 965.0e6, u: Pa, d: "Published minimum 0.2 % yield strength", s: "Upper Metals AMS 5519 datasheet: 140 ksi = 965 MPa minimum", t: reference}
    joint_efficiency: {v: 0.7, u: "-", d: "Weld joint efficiency. Low on purpose: fusion welding anneals the cold work that gives full-hard 301 its strength, so a welded seam is much weaker than the parent sheet", s: "Assumed; the mechanism is why Atlas-type balloon tanks were built from carefully welded cold-rolled sheet", t: assumed}
    safety_factor: {v: 1.4, u: "-", d: "Factor applied to pressure for sizing", s: "Assumed, same as Al-2219 so the materials compare", t: assumed}
    corrosion_allowance_m: {v: 0.0, u: m, d: "No chem-mill or corrosion allowance assumed for stainless", s: "Assumed", t: assumed}
    t_min_m: {v: 0.0004, u: m, d: "Minimum practical gauge. Thin-gauge stainless is the point of this material: pressure-stabilised tanks were built from sheet a few tenths of a millimetre thick", s: "Assumed", t: assumed}
    E_Pa: {v: 193.0e9, u: Pa, d: "Young's modulus", s: "Upper Metals AMS 5519 datasheet: 28e6 psi = 193 GPa", t: reference}
    poisson: {v: 0.28, u: "-", d: "Poisson ratio", s: "MakeItFrom full-hard 301: 0.28", t: reference}
    t_min_structural_m: {v: 0.0003, u: m, d: "Minimum gauge for a load-carrying skin", s: "Assumed", t: assumed}

  SS-304L:
    name: {v: "Stainless steel 304L, annealed", u: "-", d: "Material label", s: "Common cryogenic-tank stainless", t: reference}
    rho_kg_m3: {v: 8030.0, u: "kg/m^3", d: "Density", s: "Combined Metals 304L datasheet: 0.29 lb/in^3 = 8.03 g/cm^3", t: reference}
    alpha_per_K: {v: 16.9e-6, u: "1/K", d: "Coefficient of thermal expansion", s: "Combined Metals 304L datasheet: 16.9 um/m-C (20-300 C)", t: reference}
    sigma_allow_Pa: {v: 108.0e6, u: Pa, d: "Allowable membrane stress before safety factor: 0.633 x minimum yield, the same basis as Al-2219. LOW, because annealed 304L is a soft material - its attraction is toughness and weldability, not strength", s: "Derived: 0.633 x 170 MPa minimum yield. Not a qualified allowable", t: assumed}
    yield_min_Pa: {v: 170.0e6, u: Pa, d: "Published minimum 0.2 % yield strength, annealed", s: "Combined Metals 304L datasheet: 25 ksi = 170 MPa minimum, annealed", t: reference}
    joint_efficiency: {v: 1.0, u: "-", d: "Weld joint efficiency: an annealed austenitic weld is as strong as the annealed parent, which is much of why this grade is welded into tanks", s: "Assumed", t: assumed}
    safety_factor: {v: 1.4, u: "-", d: "Factor applied to pressure for sizing", s: "Assumed, same as Al-2219 so the materials compare", t: assumed}
    corrosion_allowance_m: {v: 0.0, u: m, d: "No chem-mill or corrosion allowance assumed for stainless", s: "Assumed", t: assumed}
    t_min_m: {v: 0.0015, u: m, d: "Minimum practical gauge. Higher than for full-hard 301 because the low allowable drives thickness anyway", s: "Assumed", t: assumed}
    E_Pa: {v: 193.0e9, u: Pa, d: "Young's modulus", s: "Combined Metals 304L datasheet: 28.0e3 ksi = 193 GPa", t: reference}
    poisson: {v: 0.29, u: "-", d: "Poisson ratio", s: "Handbook value for austenitic stainless (supplementary)", t: assumed}
    t_min_structural_m: {v: 0.0005, u: m, d: "Minimum gauge for a load-carrying skin", s: "Assumed", t: assumed}

  Ti-6Al-4V:
    name: {v: "Titanium Ti-6Al-4V, grade 5 annealed (AMS 4911)", u: "-", d: "Material label", s: "AMS 4911 annealed sheet", t: reference}
    rho_kg_m3: {v: 4430.0, u: "kg/m^3", d: "Density", s: "Handbook value for Ti-6Al-4V (supplementary; not on the AMS 4911 sheet consulted)", t: assumed}
    alpha_per_K: {v: 8.6e-6, u: "1/K", d: "Coefficient of thermal expansion", s: "Handbook value for Ti-6Al-4V (supplementary)", t: assumed}
    sigma_allow_Pa: {v: 522.0e6, u: Pa, d: "Allowable membrane stress before safety factor: 0.633 x minimum yield, the same basis as Al-2219", s: "Derived: 0.633 x 825 MPa (AMS 4911 minimum 0.2 % proof). Not a qualified allowable", t: assumed}
    yield_min_Pa: {v: 825.0e6, u: Pa, d: "Published minimum 0.2 % proof strength, annealed", s: "RS Components AMS 4911 Ti-6Al-4V datasheet: >= 825 MPa", t: reference}
    joint_efficiency: {v: 0.9, u: "-", d: "Weld joint efficiency. Titanium welds well but only under inert cover; contamination embrittles the seam", s: "Assumed", t: assumed}
    safety_factor: {v: 1.4, u: "-", d: "Factor applied to pressure for sizing", s: "Assumed, same as Al-2219 so the materials compare", t: assumed}
    corrosion_allowance_m: {v: 0.0, u: m, d: "No corrosion allowance assumed for titanium", s: "Assumed", t: assumed}
    t_min_m: {v: 0.0008, u: m, d: "Minimum practical gauge", s: "Assumed", t: assumed}
    E_Pa: {v: 114.0e9, u: Pa, d: "Young's modulus. Note it is well below steel, so a titanium shell buckles sooner than its strength alone suggests", s: "RS Components AMS 4911 datasheet: 114 GPa", t: reference}
    poisson: {v: 0.34, u: "-", d: "Poisson ratio", s: "Handbook value for Ti-6Al-4V (supplementary)", t: assumed}
    t_min_structural_m: {v: 0.0005, u: m, d: "Minimum gauge for a load-carrying skin", s: "Assumed", t: assumed}

convergence:
  tol: {v: 1.0e-9, u: "-", d: "Relative-change convergence tolerance (GLOM, stage dry masses, propellant)", s: "Engineering choice", t: assumed}
  max_iter: {v: 200, u: "-", d: "Iteration limit", s: "Engineering choice", t: assumed}
  relax: {v: 1.0, u: "-", d: "Under-relaxation factor on dry-mass update (1 = none)", s: "Engineering choice", t: assumed}

mer_scatter:
  # Relative 1-sigma scatter of each mass-estimating relationship, for the Monte-Carlo in uncertainty.py.
  #
  # The book publishes the MER coefficients but no scatter for them, so most numbers here are ASSUMPTIONS and are
  # tagged as such. Two are not: engine_mass and solid_casing were MEASURED in v0.15 by running the relation
  # against every engine or motor that publishes the matching figure, and carry t: reference with the method that
  # produced them (engine_db.mer_check(), solid_inert.error_stats()). They are anchored on this tool's own validation: against twelve real vehicles the median GLOM
  # error is 17 % and the spread of individual stage structural factors against published values is roughly
  # +/- 25 % (docs/VALIDATION_REPORT.md), which is what a mass-estimating relationship fitted to a historical
  # population should be expected to do. Treat the resulting interval as "how much the method could be wrong",
  # not as a probability anyone has measured.
  #
  # Set any entry to 0 to freeze that coefficient.
  engine_mass: {v: 0.37, u: "-", d: "1-sigma on the Table 8.9 engine-mass MER (coefficients a, b, c scaled together)", s: "MEASURED, not assumed (R20): the MER was run against the eight database engines that publish a dry mass, giving a standard deviation of 37 % about a median of -24 % (16 engines as of v0.16). The spread is real - the RS-68 comes out 55 % light because of its ablative nozzle, the Merlin 1D 104 % heavy because it is the lightest engine ever flown for its thrust. engine_db.mer_check() reproduces the figure", t: reference}
  thrust_structure: {v: 0.20, u: "-", d: "1-sigma on the thrust-structure MER", s: "Assumed; simple thrust-per-mass rule, no load path modelled", t: assumed}
  unpressurized_structure: {v: 0.20, u: "-", d: "1-sigma on the 13.3 kg/m2 skirt/interstage/fairing areal mass", s: "Assumed; one areal density covers every structural concept (skin-stringer to sandwich)", t: assumed}
  tank_mass: {v: 0.18, u: "-", d: "1-sigma on the tank MERs (Table 8.6 propellant-mass and Table 8.7 volume forms)", s: "Assumed; Table 8.6 is valid only at its reference densities and ignores pressure and load", t: assumed}
  solid_casing: {v: 0.25, u: "-", d: "1-sigma on the solid-motor casing coefficient k (Eq. 8:18)", s: "MEASURED (R18): the published stage-level regressions of solid_inert carry a mean absolute error of 17-20 % over 34 flown stages, and the book's own k sits above the whole composite population. 25 % is the composite fit's own reported RMS percentage error", t: reference}
  avionics: {v: 0.30, u: "-", d: "1-sigma on the avionics mass", s: "Assumed; a two-value step (75/350 kg) cannot describe a population, and it is visibly heavy for small launchers", t: assumed}
  paf: {v: 0.20, u: "-", d: "1-sigma on the payload attach fitting mass", s: "Assumed", t: assumed}
  wiring: {v: 0.25, u: "-", d: "1-sigma on the wiring mass per metre", s: "Assumed", t: assumed}
  residual_propellant: {v: 0.30, u: "-", d: "1-sigma on the residual-propellant fraction", s: "Assumed; depends on feed-system design and shutdown accuracy, neither of which is modelled", t: assumed}
  isp_delivered: {v: 0.01, u: "-", d: "1-sigma on delivered specific impulse", s: "Assumed; about 3 s on a 300 s engine, which is a typical acceptance-test band", t: assumed}
