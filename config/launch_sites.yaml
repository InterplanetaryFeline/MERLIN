  region: Europe
  country: Poland
  orbital: false
  latitude_deg: 54.5483
  longitude_deg: 16.6067
  source: "Centralny Poligon Sil Powietrznych (Central Air Force Training Range), on the Baltic coast between Ustka and Jaroslawiec around Lake Wicko, per Polish Wikipedia 'Centralny Poligon Sil Powietrznych' (read 2026-11-21). SUBORBITAL ONLY: a military test range used for sounding rockets such as SpaceForest PERUN and ILR-33 Bursztyn, not a cosmodrome. No coordinate is published for the range or its launch pad; this is the coordinate of the village of Wicko Morskie, which lies inside the range, from Polish Wikipedia 'Wicko Morskie' (54 deg 32' 54'' N, 16 deg 36' 24'' E, read 2026-11-21). The range covers about 4,000 ha, so the pad is within a few kilometres of this point."
- name: SUAS Aerospace (proposed, south-west Ireland)
  region: Europe
  country: Ireland
  status: proposed
  latitude_deg: 51.9536
  longitude_deg: -8.1755
  source: "PROPOSED, NO SITE CHOSEN. SUAS Aerospace plans an orbital and suborbital spaceport in Ireland for polar orbits (suasaerospace.com/vision, read 2026-11-21); its feasibility study points to the south-west coast, and as of its October 2024 pathfinder announcement site acquisition was still to be done (europeanspaceflight.com, 2024-01-03; suasaerospace.com press release, 2024-10-24). The coordinate is a STAND-IN: the company's headquarters at Elfordstown Earthstation near Midleton, County Cork (Wikipedia 'Elfordstown Earthstation', 51.9536 N, 8.1755 W, read 2026-11-21). Ireland's south-west coast lies within about half a degree of this latitude, which moves the rotation credit by under 3 m/s; the longitude places the impact-point map inland, so type the real one when a site is announced."
