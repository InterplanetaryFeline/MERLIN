# Launch site library
#
# Real launch sites, so a design can state WHERE it launches from instead of carrying a bare latitude.
# Reference a row from the design's mission block with
#
#   launch_site:
#     site:
#       v: Kennedy Space Center LC-39A
#       u: '-'
#       d: Launch site chosen from the library; fills latitude
#       s: config/launch_sites.yaml
#       t: reference
#
# and `latitude_deg` is filled from the row. Leave `site` null to type a latitude by hand - that is the
# "Custom" option in the GUI, and nothing here touches the design.
#
# WHAT THIS LIBRARY DOES AND DOES NOT GIVE YOU, read this before trusting it.
#   * latitude_deg and longitude_deg are the published coordinates of the pad or range named in `name`.
#     Latitude is what the performance model uses (Earth-rotation credit and the azimuth relation
#     sin b = cos i / cos lat). Longitude is used by the impact-point map, which walks the downrange
#     distance from this meridian along the launch azimuth; both are filled into the design when a site
#     is named. Launch windows are still not modelled.
#   * A site constrains the inclinations you can reach in TWO ways, and only the first is modelled here:
#       1. PHYSICS. A direct ascent cannot reach an inclination below the site latitude, because
#          cos i / cos lat > 1 has no solution. The tool computes that floor from the latitude and
#          refuses a lower inclination rather than quietly flying a dog-leg (orbit.launch_azimuth_deg).
#       2. RANGE SAFETY. Every real site also has azimuth corridors set by what the rocket may fly over,
#          which cut the reachable band further and differ per pad, per vehicle and per year.
#     Those corridors are NOT in this library and are NOT modelled. No azimuth limits have been invented
#     to fill the gap: a site that in reality cannot launch due east is not flagged as such here. Treat
#     the computed floor as a necessary condition, never a sufficient one.
#   * altitude_m is deliberately ABSENT. The sources used give coordinates but not pad elevation, and site
#     altitude is recorded-but-unused in the performance model, so choosing a site leaves whatever
#     altitude the design already states alone rather than overwriting it with a guessed zero.
#   * Coordinates are to 4 decimal places where the source gives them, which is about 11 m - far finer than
#     anything in this tool needs. A large range (Baikonur, Jiuquan) has many pads tens of kilometres apart;
#     where the row names a range rather than a pad, the coordinate is the reference point the source gives
#     and the latitude is good to a few hundredths of a degree, which is immaterial to the rotation credit.
#
#   * `region` is the CONTINENT the site stands on, which is what the GUI groups the list by: Kourou is in
#     South America although it is a European site, Baikonur in Asia, Plesetsk and Kapustin Yar in Europe.
#     `country` says whose it is.
#   * `orbital: false` marks a range that flies suborbital rockets only. It is in the library because its
#     latitude is still the right one for a sounding-rocket or test-vehicle design, but the tool sizes
#     orbital vehicles, and a site so marked is not a place any orbital rocket has been launched from.
#   * `status: proposed` marks a site that does not exist yet. Its coordinate is a stand-in, and the row's
#     source says what it stands in for.
#
# All values SI (degrees for angles). Latitude is positive north, longitude positive east.

meta:
  version: 1
  retrieved: 2026-10-18
  note: >-
    Coordinates read from Wikipedia 'List of rocket launch sites' on 2026-10-18, except SaxaVord, which is
    not listed there and was read from Wikipedia 'SaxaVord Spaceport' on the same date. Both are secondary
    sources. They are used because the pad coordinate only has to be good to a few hundredths of a degree
    for the Earth-rotation credit, and because no primary range document covers all these countries.
    The two rows added on 2026-11-21 (CPSP Ustka and SUAS Aerospace) were read from other pages on that
    date, named in each row, and carry coarser coordinates than the rest; each row says why.

