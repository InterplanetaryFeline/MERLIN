# Engine and motor database
#
# Real propulsion hardware, so a design can stop being a "rubber engine". Reference a row from a stage with
#
#   engine:
#     from_database: {v: "RD-180", u: "-", d: "Real engine; fills thrust, Isp, Pc, area ratio, mass and envelope",
#                     s: "config/engine_database.yaml", t: reference}
#
# and every field you do NOT give explicitly in that stage is filled from the row below. Anything you do give wins,
# so a database row is a default, never an override.
#
# PROVENANCE, read this before trusting a number.
#   * Each row names its own source. Most rows are now the BOOK's own engine tables - Table 4.14 (p.245) for the
#     eighteen-engine performance summary, Table 4.11 (p.241) for the F-1, Table 4.12 (p.242) for the J-2 and
#     Table 4.13 (p.243) for the RS-68 - and are marked `confidence: published` accordingly. The rest are public
#     manufacturer or encyclopaedia figures, or peer-reviewed papers for the peroxide engines, and are NOT
#     verified by this tool's author beyond reading the cited page.
#   * `confidence: published` means the source states the figure directly. `confidence: approximate` means it was
#     derived, rounded, or the source is a secondary one - treat it as an engineering estimate.
#   * Blank (null) fields are genuinely unknown and stay unknown: the tool keeps whatever the design file says and
#     tells you which fields the database could not supply. Nothing here is invented to fill a gap.
#   * Manufacturers publish different numbers at different times, and some figures (engine dry mass above all) are
#     quoted with and without the thrust frame, gimbals or hydraulics. Expect a few per cent of scatter.
#
# All values SI. isp_sl_s is null for an engine that is only flown in vacuum.

meta:
  version: 1
  retrieved: 2026-10-12
  note: >-
    Book engine tables (4.11-4.14) where the book has the engine, otherwise public manufacturer, encyclopaedia or
    published-paper figures. Every row cites its own source. Where a source gives a range or several revisions,
    the row states which one was taken.

cycles:
  # Power cycle: what it implies for chamber pressure and for the engine mass MER. The pressure bands are the
  # usual flight range of each cycle, used only to flag a design that sits outside it - they are not limits.
  pressure_fed:
    chamber_pressure_bar: [5, 35]
    isp_note: "Lowest performance; tank pressure sets chamber pressure, so tanks are heavy"
    source: "Standard propulsion-system classification (book Sec. 4.7, pp.242-256). Upper bound raised from 30 to
      35 bar by the flown Gamma-2 in this database, which runs at 31 bar"
  electric_pump:
    chamber_pressure_bar: [10, 60]
    isp_note: "Pump power from batteries; battery mass grows with burn time"
    source: "Rutherford is the flown example; book does not cover this cycle"
  gas_generator:
    chamber_pressure_bar: [30, 130]
    isp_note: "Open cycle: a few per cent of flow bypasses the chamber, costing some Isp"
    source: "Book Sec. 4.7 (pp.242-256). The lower bound is set by HM7B in this database, a flown gas-generator
      engine at 37 bar; a band that flags its own data is miscalibrated, so 30 bar is used rather than 40"
  staged_combustion:
    chamber_pressure_bar: [100, 300]
    isp_note: "Closed cycle: highest chamber pressure and Isp, highest complexity"
    source: "Book Sec. 4.7 (pp.242-256). Lower bound set from this database rather than assumed: the book's own
      Table 4.14 lists the staged-combustion RD-253 at 147 bar and RD-0210 at 147 bar, and the peroxide RD161P
      runs at 118 bar, so a 150 bar floor would flag four real engines. A band that flags its own data is
      miscalibrated"
  expander:
    chamber_pressure_bar: [20, 70]
    isp_note: "Closed cycle limited by heat available from the nozzle; suits small hydrogen upper stages"
    source: "Book Sec. 4.7 (pp.242-256)"
  expander_bleed:
    chamber_pressure_bar: [20, 110]
    isp_note: "OPEN variant of the expander: the hydrogen heated in the chamber wall drives the turbine and is
      then dumped overboard rather than returned to the chamber, which costs a little Isp but lifts the
      chamber-pressure ceiling the closed expander runs into"
    source: "Not a cycle the book covers - Sec. 4.7 names the closed expander only. The band is set from flown
      Japanese examples rather than assumed: the LE-5B in this database runs at 35.8 bar and the LE-9 at about
      100 bar, so the band brackets its own data in the same way the electric_pump band does"
  solid:
    chamber_pressure_bar: [30, 110]
    isp_note: "Solid motor; chamber pressure follows the grain and the burn-rate law r = a Pc^n"
    source: "Book Sec. 4.4 (pp.229-235)"

