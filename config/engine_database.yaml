# ----------------------------------------------------------------------------------------------------------
# STAR-family upper-stage and apogee-kick motors.
#
# These are here so a small launch vehicle's upper stage can be a REAL motor instead of a rubber one. Each
# row's casing_k is that motor's own published inert/propellant ratio, so naming the motor replaces the
# book's generic k = 0.1154 with the mass the hardware actually has - which in this size class the book
# over-predicts by 26-51 % (see solid_inert.MOTOR_DATASET and docs/VALIDATION_REPORT.md section 3.2).
#
# WHAT THESE ARE. Upper-stage and apogee-kick motors: titanium or filament-wound cases, most with no TVC,
# no thrust termination and no flight structure beyond the attachment ring. They are the lightest class of
# solid motor that exists. A FIRST stage needs TVC, heavier skirts and much larger flight loads, and will
# be heavier than any casing_k here - do not borrow one of these for a booster.
#
# Masses, Isp and total impulse: Wikipedia 'Star (rocket stage)' family tables, read 2026-10-24, except the
# Star 31, whose figures are Thiokol's own (Carr & Walstrum, 3rd AIAA/USU Small Satellite Conf., 1989).
# casing_k is derived as burnout/propellant. Where the source gives total impulse and burn time but no
# thrust, thrust is total impulse / burn time and the row says so. Diameter is the nominal case diameter in
# inches encoded in the designation, which the source states.
