[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "merlin-launch-vehicle"
version = "1.4.0"
description = "MERLIN: Mass Estimation Relationships for Launch vehicle Initial sizing"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.13", "openpyxl>=3.1", "matplotlib>=3.7", "PyYAML>=6.0"]

[project.optional-dependencies]
app = ["pywebview>=5.0"]
build-app = ["pywebview>=5.0", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"launch_vehicle" = ["gui_static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
