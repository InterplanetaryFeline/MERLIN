# Builds the Windows desktop app and attaches it to a GitHub Release.
#
# To publish a version: set the version in pyproject.toml, src/launch_vehicle/__init__.py, README.md and
# CITATION.cff (tests/test_project_metadata.py checks they agree), add a docs/CHANGELOG.md entry, commit, then
#
#     git tag v1.0.0
#     git push origin v1.0.0
#
# Run it by hand from the Actions tab to build the zip without publishing; it is then kept as a workflow artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -r requirements.txt pywebview pyinstaller

      - name: The tag must match the version the project states
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $v"; exit 1
          fi

      - name: Test
        run: python -m pytest tests/ -q --no-header -p no:cacheprovider

      - name: Build the app and its zip
        run: python tools/build_app.py --zip

      - name: Keep the zip with this run
        uses: actions/upload-artifact@v4
        with:
          name: MERLIN-windows
          path: dist/MERLIN-*-windows.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/MERLIN-*-windows.zip)
          notes="Windows app: download the zip below, unzip it, and run MERLIN/MERLIN.exe. No Python needed. What changed: docs/CHANGELOG.md."
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "MERLIN ${GITHUB_REF_NAME#v}" --notes "$notes"
          fi
