# Three-stage ALL-SOLID small launcher: 150 kg to a 500 km sun-synchronous orbit.
# SOFTWARE DEMONSTRATION of the solid-motor path (book Sec. 8.5) - not a real vehicle.
# Leaf format: {v: value, u: units, d: description, s: source/justification, t: user|reference|assumed}
meta: {name: "SOLID-3STAGE-150kg-SSO", description: "All-solid three-stage small launcher demonstration"}

mission:
