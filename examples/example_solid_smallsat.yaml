    model: {v: book_penalty, u: "-", d: "Book Eq. 3:36-3:38 lumped ascent-loss regression", s: "Book pp.181-182", t: reference}
    staging_delay_s: {v: 5.0, u: s, d: "Coast/ignition delay per separation (solid stages often coast)", s: "Assumed", t: assumed}
    gravity_mps: {v: 1300.0, u: m/s, d: "Unused with book_penalty", s: "Assumed", t: assumed}
    drag_mps: {v: 150.0, u: m/s, d: "Unused with book_penalty", s: "Assumed", t: assumed}
    steering_mps: {v: 150.0, u: m/s, d: "Unused with book_penalty", s: "Assumed", t: assumed}
    other_allowance_mps: {v: 0.0, u: m/s, d: "No extra allowance", s: "Assumed", t: assumed}
