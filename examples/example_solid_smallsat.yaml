  payload_adapter_mass_kg: {v: null, u: kg, d: "null = PAF MER (Table 8.8 row 4)", s: "Book Table 8.8", t: reference}
  payload_envelope_diameter_m: {v: 0.9, u: m, d: "Payload static envelope diameter", s: "User requirement", t: assumed}
  payload_envelope_length_m: {v: 1.2, u: m, d: "Payload static envelope length", s: "User requirement", t: assumed}
  delta_v_override_mps: {v: null, u: m/s, d: "Budget override (unused)", s: "User", t: user}
  orbit:
    type: {v: SSO, u: "-", d: "Sun-synchronous orbit (inclination computed from J2)", s: "User requirement", t: user}
    perigee_altitude_km: {v: 500.0, u: km, d: "Circular injection altitude", s: "User requirement", t: user}
    apogee_altitude_km: {v: null, u: km, d: "Circular", s: "User", t: user}
    eccentricity: {v: null, u: "-", d: "Circular", s: "User", t: user}
    inclination_deg: {v: 97.4, u: deg, d: "Overridden by the SSO computation", s: "User", t: user}
  launch_site:
    site: {v: null, u: "-", d: "Launch site from config/launch_sites.yaml; fills latitude and longitude. null = Custom, type the coordinates below", s: "User choice; the coordinates it fills are registered against the library's own source", t: user}
    latitude_deg: {v: 34.7, u: deg, d: "Vandenberg-like latitude", s: "User", t: user}
    longitude_deg: {v: null, u: deg, d: "Launch site longitude, east positive; used only to place impact points on a map. null = unknown, which gives drop-zone distances but no coordinates", s: "Not stated; type one to place drop zones on a map", t: user}
    altitude_m: {v: 0.0, u: m, d: "Sea level", s: "User", t: user}
    azimuth_deg: {v: null, u: deg, d: "Computed from inclination", s: "Computed", t: assumed}
    include_earth_rotation: {v: true, u: "-", d: "Vector Earth-rotation term (negative for retrograde SSO)", s: "Book Example 3.9 method", t: reference}
