# Peroxide/kerosene example. The oxidiser, fuel and mixture ratio come from the
# propellant-combination library; the engine performance from the engine database.
meta:
  name: EX-HTP98-RP1-2t-LEO
  description: Two-stage high-test-peroxide / kerosene vehicle, 2 t to 400 km LEO. Demonstrates the propellant-combination library (HTP-98/RP-1) and the engine database (BA-44, RD161P) together. Peroxide
    buys density and storability and costs Isp; this design is the honest consequence of that trade, not an advertisement for it.
mission:
  payload_mass_kg:
    v: 2000.0
    u: kg
    d: Payload mass delivered to the injection orbit (excludes adapter and fairing)
    s: Design requirement for this example
    t: user
  payload_adapter_mass_kg:
    v: null
    u: kg
    d: Payload adapter / PAF mass; null = use MER 0.0755 m_PL + 50
    s: Book Table 8.8 row 4 (p.495) when null
    t: reference
  payload_envelope_diameter_m:
    v: 1.4
    u: m
    d: Payload static envelope diameter
    s: Design choice
    t: user
  payload_envelope_length_m:
    v: 2.0
    u: m
    d: Payload static envelope cylindrical length
    s: Design choice
    t: user
  delta_v_override_mps:
    v: null
    u: m/s
    d: If non-null, replaces the whole budget total (testing / design studies only)
    s: User override
    t: user
  orbit:
    type:
      v: LEO
      u: '-'
      d: LEO | SSO | GTO | GEO_VIA_GTO | GEO_DIRECT | CUSTOM
      s: User requirement
      t: user
    perigee_altitude_km:
      v: 400.0
      u: km
      d: Injection (perigee) altitude
      s: Design requirement
      t: user
    apogee_altitude_km:
      v: null
      u: km
      d: Apogee altitude (null for circular orbits)
      s: User requirement
      t: user
    eccentricity:
      v: null
      u: '-'
      d: Eccentricity (alternative to apogee altitude)
      s: User requirement
      t: user
    inclination_deg:
      v: 28.5
      u: deg
      d: 'Orbital inclination (ignored for SSO: computed)'
      s: User requirement
      t: user
  launch_site:
    site:
      v: null
      u: '-'
      d: Launch site from config/launch_sites.yaml; fills latitude and longitude. null = Custom, type the coordinates below
      s: User choice; the coordinates it fills are registered against the library's own source
      t: user
    latitude_deg:
      v: 28.5
      u: deg
      d: Launch site geodetic latitude (spherical Earth assumed)
      s: User (KSC-like latitude, book Example 3.9 p.185)
      t: user
    longitude_deg:
      v: null
      u: deg
      d: Launch site longitude, east positive; used only to place impact points on a map. null = unknown, which gives drop-zone distances but no coordinates
      s: Not stated; type one to place drop zones on a map
      t: user
    altitude_m:
      v: 0.0
      u: m
      d: Launch site altitude (recorded; not used in v1 performance model)
      s: User
      t: user
    azimuth_deg:
      v: null
      u: deg
      d: Launch azimuth from North; null = computed from inclination (sin b = cos i / cos lat)
      s: Computed when null
      t: assumed
    include_earth_rotation:
      v: true
      u: '-'
      d: "Include Earth's rotation, by subtracting the launch site's eastward speed from the delta-v the vehicle must supply (justified for a direct, eastward-type ascent from a fixed site)"
      s: Book Example 3.9 (p.185) method
      t: reference
  losses:
    model:
      v: book_penalty
      u: '-'
      d: 'Ascent-loss model: book_penalty (Book Eq. 3:36-3:38 regression, lumped gravity+drag+steering+propulsion) | user (explicit values below)'
      s: Book pp.181-182 (RMS error ~260 m/s for LEO)
      t: reference
    staging_delay_s:
      v: 3.0
      u: s
      d: 'Ignition/staging delay added to ascent time per stage separation (book: delays ''should be considered'')'
      s: Assumed; book p.181 says delays should be considered
      t: assumed
    gravity_mps:
      v: 1200.0
      u: m/s
      d: Gravity-loss estimate (used only when model = user)
      s: Assumed; Table 3.4 range 1,150-1,534 m/s (p.180)
      t: assumed
    drag_mps:
      v: 100.0
      u: m/s
      d: Drag-loss estimate (model = user only)
      s: Assumed; Table 3.4 range 40-156 m/s (p.180)
      t: assumed
    steering_mps:
      v: 150.0
      u: m/s
      d: Steering-loss estimate (model = user only)
      s: Assumed; Table 3.4 range 33-358 m/s (p.180)
      t: assumed
    other_allowance_mps:
      v: 0.0
      u: m/s
      d: Other explicit allowances on top of the loss model
      s: None assumed (avoid double counting with margin)
      t: assumed
    design_margin_fraction:
      v: 0.0
      u: '-'
      d: 'Delta-v design margin as fraction of subtotal (applied once). Book regression RMS error is ~260 m/s (~3 %): consider 0.03'
      s: Set to 0 so the book regression is reported unmodified; user may add margin
      t: assumed
  atmosphere_model:
    v: book_exponential
    u: '-'
    d: book_exponential (Eqs. 6:50/6:53, h0 = 7.64 km, with US76 temperature for the speed of sound) | us76 (the 1976 standard throughout)
    s: Book pp.362-363
    t: reference
  vertical_rise_s:
    v: 10.0
    u: s
    d: Vertical climb before the pitch kick that starts the gravity turn; the book waits 'a few seconds until the vehicle climbs above ground objects' (p.369)
    s: Assumed; book Sec. 6.4.7
    t: assumed
  last_ascent_stage:
    v: null
    u: '-'
    d: Stop the ascent integration after this stage, for a vehicle whose upper stage restarts after a parking-orbit coast (null = fly every stage back to back)
    s: User
    t: user
  aerodynamics:
    drag_model:
      v: geometry
      u: '-'
      d: geometry (Cd built up from this vehicle's own shape, against Mach) | book_titan2 (Fig. 6.13 analytic Cd(M), one vehicle's curve) | table (your own Cd against Mach, in mach_table and cd_table) | constant (one Cd at every Mach, for hand checks)
      s: SUPPLEMENTARY - the book gives no geometry method and points to Missile DATCOM (p.358); build-up after Fleeman, Tactical Missile Design (2001) pp.23-24 and the OpenRocket technical documentation; measured in docs/DRAG.md
      t: assumed
    surface_roughness_m:
      v: 5.0e-05
      u: m
      d: Surface roughness height for the skin-friction term of drag_model 'geometry'. A painted or bare-metal skin with rivets, weld lands and insulation; rougher raises friction drag
      s: Assumed
      t: assumed
    nose_shape:
      v: cone
      u: '-'
      d: cone | ogive - shape of the fairing nose for drag_model 'geometry'. The drawing shows a cone either way; an ogive of the same length has less drag below Mach 1 and the same above
      s: Assumed, to match the conical nose the layout draws
      t: assumed
    nose_bluntness:
      v: 0.0
      u: '-'
      d: Diameter of a spherical nose tip as a fraction of the fairing diameter, for drag_model 'geometry' (0 = sharp). Real fairings are blunted, which adds drag (Fleeman p.24)
      s: Assumed
      t: assumed
    constant_cd:
      v: 0.29
      u: '-'
      d: Cd for drag_model 'constant'; the book's rule of thumb is that missile Cd is around 0.2 for much of the envelope (p.359)
      s: Book p.359
      t: reference
    mach_table:
      v: [0.0, 0.8, 1.068, 1.5, 2.0, 3.0, 5.0, 8.0]
      u: '-'
      d: Mach numbers for drag_model 'table', in rising order. Replace these and cd_table with your own data; Cd is interpolated between points and held constant beyond the first and last
      s: Placeholder - sample points of the book's Titan II curve, Fig. 6.13 p.361
      t: reference
    cd_table:
      v: [0.29, 0.29, 0.558, 0.4243, 0.341, 0.2577, 0.191, 0.1535]
      u: '-'
      d: Drag coefficient at each Mach number of mach_table, for drag_model 'table' (same number of entries)
      s: Placeholder - the book's Titan II curve, Fig. 6.13 p.361, evaluated at the mach_table points
      t: reference
    cna_overrides:
      v: null
      u: 1/rad
      d: 'Normal-force slope per tapering segment for the flight load cases, as {name fragment: CNa per radian}; null uses the slender-body 2/rad of book Table 9.7. Supply chart reads from Figs. 9.38-9.39
        here when the vehicle is supersonic at max-q'
      s: User
      t: user
  cost_year:
    v: 2010
    u: year
    d: Year whose constant dollars the cost estimate is reported in. 2010 is the book's own reference year for all its TRANSCOST examples and the year of the bold NASA work-year value in Table 17.3; other
      years are escalated from it by Eq. 17.1 at 3.1 %/yr
    s: Book Sec. 17.6 and Table 17.3, p.1002
    t: reference
  pad_height_m:
    v: 0.0
    u: m
    d: Height of the stage-1 nozzle exit plane above the ground when the vehicle stands on its launch mount; the ground wind profile v = 9.5 h^0.2 is a function of height above the ground, so a tall mount
      raises the whole wind load (the book's Saturn V sits with its base at 4.16 m)
    s: Assumed; book Table 9.5 geometry (p.566)
    t: assumed
fairing:
  diameter_m:
    v: 1.9
    u: m
    d: Fairing outer diameter (must equal upper-stage diameter in v1)
    s: Must equal the upper-stage diameter in this model version
    t: user
  nose_length_over_D:
    v: 1.0
    u: '-'
    d: Conical nose length / diameter
    s: Assumed; book Fig. 8.10 sizes the PLF at about 2 D total (p.479)
    t: assumed
  axial_clearance_m:
    v: 0.2
    u: m
    d: Axial clearance added to payload envelope length
    s: Assumed
    t: assumed
  radial_clearance_m:
    v: 0.1
    u: m
    d: Radial clearance between envelope and fairing
    s: Assumed
    t: assumed
  material:
    v: metal
    u: '-'
    d: metal | composite (selects areal mass MER)
    s: Book Table 8.8 rows 1-2 (p.495)
    t: reference
  jettison_at_stage_start:
    v: 2
    u: '-'
    d: Fairing is jettisoned at the START of this stage's burn
    s: Assumed; book Example 2 notes jettison shortly after stage-2 start (p.506)
    t: assumed
  mass_override_kg:
    v: null
    u: kg
    d: Override fairing mass (null = MER x area)
    s: User
    t: user
vehicle:
  paf_length_over_D:
    v: 0.25
    u: '-'
    d: Payload attach fitting height / upper-stage diameter
    s: Book Table 8.11 label 'PAF, h = D/4' (p.506)
    t: reference
  payload_adapter_method:
    v: mer
    u: '-'
    d: 'PAF mass model: mer (Table 8.8 row 4: 0.0755 m_PL + 50 kg) | fraction (0.15 m_PL) | auto (fraction below the small-payload threshold)'
    s: Book Table 8.8; 1st-ed. errata p.443 recommends 0.15 m_PL for smaller payloads
    t: reference
  dv_allocation_mode:
    v: fractions
    u: '-'
    d: fractions | fixed
    s: User
    t: user
  optimise_dv_split:
    v: true
    u: '-'
    d: "Replace the delta-v split below with the optimum before sizing, so the vehicle reported is the vehicle optimised. Off means the split is yours and is used as written"
    s: User
    t: user
  optimise_objective:
    v: glom
    u: '-'
    d: "What to optimise towards when optimise_dv_split is on: glom (lightest vehicle) | cost (lowest development cost) | payload (most payload at the same lift-off mass)"
    s: User
    t: user
  dv_fractions:
    v:
    - 0.44
    - 0.56
    u: '-'
    d: Share of total delta-v per stage (normalised)
    s: Assumed; book Example 1 staging gives 3,757/8,599 = 0.44 (p.480)
    t: assumed
  dv_fixed_mps:
    v: null
    u: m/s
    d: Fixed per-stage delta-v (last may be null = remainder)
    s: User
    t: user
constraints:
  max_vehicle_length_m:
    v: 60.0
    u: m
    d: Maximum allowed overall length
    s: Relaxed for this example
    t: user
  min_tw_liftoff:
    v: 1.15
    u: '-'
    d: Minimum liftoff thrust/weight (sea-level thrust)
    s: Assumed engineering floor (T/W must exceed 1; book p.227)
    t: assumed
  max_accel_g:
    v: 6.0
    u: g
    d: Maximum axial acceleration at burnout (vacuum thrust)
    s: Assumed payload-environment limit
    t: assumed
  min_tw_upper:
    v: 0.4
    u: '-'
    d: Warn if upper-stage ignition T/W is below this
    s: Assumed (book Example 1 uses 0.7 on stage 2, p.482)
    t: assumed
  max_dynamic_pressure_Pa:
    v: 44000.0
    u: Pa
    d: 'Dynamic pressure the vehicle may be flown to. Constrains the ascent optimisation (--optimise-ascent); not checked against the baseline trajectory. The default is what the book''s generic launch
      vehicle reaches, NOT a certified limit: Fig. 9.36 shows 920 lbf/ft2 = 44.0 kPa, against Saturn V 35.2 kPa (Sec. 9.2), the Shuttle''s high-q profile 695 lbf/ft2 = 33.3 kPa (p.405) and Pegasus 66.9
      kPa, which the book flags as costing 322 m/s of drag loss (p.414). Replace it with your vehicle''s number'
    s: Book Fig. 9.36, p.572 (observed value, not a limit)
    t: assumed
  max_q_alpha_Pa_deg:
    v: 331800.0
    u: Pa deg
    d: 'Peak of dynamic pressure times angle of attack, the parameter that sets air loads. Constrains the ascent optimisation. The default is the book''s generic launch vehicle in Fig. 9.36: (q alpha)max
      = 6,930 lbf deg/ft2 = 331.8 kPa deg. Again an observed value, not a certified limit'
    s: Book Fig. 9.36, p.572 (observed value, not a limit)
    t: assumed
stages:
- name:
    v: HTP/RP-1 stage 1
    u: '-'
    d: Stage label
    s: label
    t: user
  residual_fraction:
    v: 0.02
    u: '-'
    d: Residual propellant fraction of mission propellant (stays on board at burnout)
    s: Book Table 8.3 (p.482)
    t: reference
  loading_margin_fraction:
    v: 0.005
    u: '-'
    d: Extra propellant loaded beyond mission need (unburned at burnout; conservative)
    s: Assumed
    t: assumed
  startup_time_s:
    v: 1.0
    u: s
    d: Engine start-up time at full mass flow (propellant consumed, no delta-v credit)
    s: Book Table 8.3 (p.482)
    t: reference
  diameter_m:
    v: 2.4
    u: m
    d: Stage external diameter
    s: 'Design choice. The upper stage is slimmer than the booster because peroxide is dense: at 2.4 m its kerosene tank came out shorter than its own end caps'
    t: user
  structure_mode:
    v: bottom_up
    u: '-'
    d: bottom_up (component MERs) | aggregate_s (structural factor)
    s: User
    t: user
  structural_factor_s:
    v: null
    u: '-'
    d: Book-convention s = m_inert/(m_inert + m_p) for aggregate_s mode
    s: Book Eq. 5:5a
    t: reference
  feed_system_mass_per_engine_kg:
    v: 25.0
    u: kg
    d: Feed lines/valves not in engine MER, per engine
    s: Assumed
    t: assumed
  pressurant_mass_fraction_of_propellant:
    v: 0.002
    u: '-'
    d: Pressurant + bottles as fraction of loaded propellant
    s: Assumed
    t: assumed
  separation_hardware_mass_kg:
    v: 60.0
    u: kg
    d: Stage separation hardware (jettisoned with this stage)
    s: Assumed
    t: assumed
  other_equipment_mass_kg:
    v: 100.0
    u: kg
    d: Other equipment (power, harness extras, TPS) lumped
    s: Assumed
    t: assumed
  structure_mass_factor:
    v: 1.0
    u: '-'
    d: Multiplier on tank-structure and unpressurised-structure MERs (1 = metallic as in the book MERs; book p.498 suggests ~0.8 for composites)
    s: Book p.498 (composite credit ~20 %); 1.0 = no credit
    t: reference
  inert_mass_margin_fraction:
    v: 0.1
    u: '-'
    d: Mass-growth margin on summed dry components (single margin, applied once)
    s: Assumed (book Example 2 reports 22-25% positive margin, p.506)
    t: assumed
  avionics_mass_override_kg:
    v: null
    u: kg
    d: Avionics mass for this stage, overriding the Table 8.8 step relationship. null = use the relationship
    s: User
    t: user
  max_length_m:
    v: null
    u: m
    d: Maximum length allowed for this stage; the design is refused if it exceeds this. null = no limit
    s: User
    t: user
  layout:
    aft_skirt_over_D:
      v: 0.5
      u: '-'
      d: Aft skirt length / D (floored by embedded engine length)
      s: Assumed
      t: assumed
    intertank_over_D:
      v: 0.25
      u: '-'
      d: Intertank length / D (separate-tank layout)
      s: Assumed
      t: assumed
    fwd_skirt_over_D:
      v: 0.25
      u: '-'
      d: Forward skirt length / D
      s: Assumed
      t: assumed
    interstage_min_length_m:
      v: 0.5
      u: m
      d: Minimum interstage length
      s: Assumed
      t: assumed
    interstage_clearance_m:
      v: 0.3
      u: m
      d: Axial clearance between upper-stage nozzle and lower-stage forward end
      s: Assumed
      t: assumed
    interstage_half_angle_deg:
      v: 15.0
      u: deg
      d: Maximum cone half-angle for diameter transitions
      s: Assumed
      t: assumed
  tank:
    diameter_m:
      v: null
      u: m
      d: Tank external diameter; null = fill the stage diameter. Lower it when the end caps alone would hold more than the tank needs - a stage whose tanks do not fill its envelope is normal
      s: User
      t: user
    user_mass_fuel_kg:
      v: null
      u: kg
      d: Fuel tank mass you supply; used only when the fuel tank mass method is user_mass
      s: User
      t: user
    user_mass_oxidizer_kg:
      v: null
      u: kg
      d: Oxidiser tank mass you supply; used only when the oxidiser tank mass method is user_mass
      s: User
      t: user
    material:
      v: Al-2219
      u: '-'
      d: Key into tank_materials
      s: User
      t: user
    arrangement:
      v: separate
      u: '-'
      d: separate | common_bulkhead
      s: User
      t: user
    order_bottom_to_top:
      v:
      - fuel
      - oxidizer
      u: '-'
      d: Tank order from the engine end upward
      s: User
      t: user
    dome_aspect_ratio:
      v: 1.41421356
      u: '-'
      d: AR = R/h_dome (1 = hemisphere, sqrt2 = 2:1 ellipsoidal)
      s: Book p.476 and Example 1 (p.484)
      t: reference
    ullage_fuel:
      v: 0.03
      u: '-'
      d: Ullage volume fraction (fuel tank)
      s: Book Example 1 (p.483)
      t: reference
    ullage_oxidizer:
      v: 0.03
      u: '-'
      d: Ullage volume fraction (oxidizer tank)
      s: Book Example 1 (p.483)
      t: reference
    mass_method_fuel:
      v: akin_volume
      u: '-'
      d: akin_propellant_mass | akin_volume | pressure_vessel | mass_fraction | user_mass
      s: Table 8.6 (p.494) has no peroxide row, so the propellant-mass MER cannot be used; the volume form (Table 8.7, p.495) applies to any propellant
      t: reference
    mass_method_oxidizer:
      v: akin_volume
      u: '-'
      d: Tank mass method (oxidizer)
      s: Table 8.6 (p.494) has no peroxide row, so the propellant-mass MER cannot be used; the volume form (Table 8.7, p.495) applies to any propellant
      t: reference
    wall_thickness_assumed_m:
      v: 0.004
      u: m
      d: Wall thickness used for internal/external geometry when mass method is not pressure_vessel
      s: Assumed
      t: assumed
    pressure_fuel_Pa:
      v: 300000.0
      u: Pa
      d: Fuel tank operating pressure (used only by pressure_vessel mass method)
      s: Assumed
      t: assumed
    pressure_oxidizer_Pa:
      v: 300000.0
      u: Pa
      d: Oxidizer tank operating pressure (pressure_vessel method only)
      s: Assumed
      t: assumed
    mass_fraction_fuel:
      v: 0.015
      u: kg/kg
      d: Tank mass / propellant mass for mass_fraction method (fuel)
      s: Assumed (cf. Table 8.6 RP-1 0.0148)
      t: assumed
    mass_fraction_oxidizer:
      v: 0.011
      u: kg/kg
      d: Tank mass / propellant mass for mass_fraction method (oxidizer)
      s: Assumed (cf. Table 8.6 LOX 0.0107)
      t: assumed
    load_temperature_K:
      v: 293.0
      u: K
      d: Tank temperature at loading (cryogenic shrinkage dT)
      s: Book Table 8.1 'Room Temp.' (p.473)
      t: reference
    insulated_fuel:
      v: false
      u: '-'
      d: External insulation on fuel tank
      s: Book Table 8.6 (none for RP-1)
      t: reference
    insulated_oxidizer:
      v: true
      u: '-'
      d: External insulation on oxidizer tank
      s: Book Table 8.6 LOX insulation row
      t: reference
  engine:
    geometry_method:
      v: user
      u: '-'
      d: How the engine envelope is sized - user (you give length and exit diameter) or book_mer (Eqs. 8:28/8:30, which needs a chamber pressure and c*)
      s: Book Sec. 8.7.7
      t: reference
    n_engines:
      v: 4
      u: '-'
      d: Number of engines (6 gives one-engine-out T/W margin, book p.504)
      s: Design choice
      t: user
    thrust_to_weight_ignition:
      v: 1.35
      u: '-'
      d: 'Rubber-engine mode: sea-level T/W at ignition'
      s: Design choice
      t: user
    thrust_vac_per_engine_N:
      v: null
      u: N
      d: 'Fixed-thrust mode: vacuum thrust per engine (null = use T/W)'
      s: 'rubber-engine mode: thrust follows T/W'
      t: user
    isp_effective_mode:
      v: vacuum
      u: '-'
      d: 'Isp used in rocket equation: vacuum | weighted | user (explicit assumption)'
      s: No sea-level Isp is published for either peroxide engine, so the VACUUM value is used throughout. That makes the first stage optimistic by roughly the usual 25-35 s sea-level penalty; read the
        resulting payload as an upper bound
      t: assumed
    isp_sl_weight:
      v: 0.3333333333
      u: '-'
      d: Weight on sea-level Isp when mode = weighted
      s: Book Eq. 4:18 (1/3 SL + 2/3 vac)
      t: reference
    isp_effective_user_s:
      v: null
      u: s
      d: Explicit effective Isp when mode = user
      s: User
      t: user
    expansion_ratio:
      v: 16.0
      u: '-'
      d: Nozzle area expansion ratio
      s: 'ASSUMED: the cited source gives no area ratio for the BA-44, and a first-stage engine needs a modest one. The database leaves the field empty rather than inventing it, so the design must state
        it'
      t: assumed
    length_m:
      v: 2.8
      u: m
      d: Engine overall length (chamber + nozzle)
      s: Assumed placeholder
      t: assumed
    exit_diameter_m:
      v: 1.2
      u: m
      d: Nozzle exit diameter
      s: Assumed placeholder
      t: assumed
    embed_fraction:
      v: 0.6
      u: '-'
      d: Fraction of engine length inside the aft skirt (rest protrudes)
      s: Assumed
      t: assumed
    mass_method:
      v: mer
      u: '-'
      d: mer | user
      s: Book Table 8.9 row 1
      t: reference
    mass_user_per_engine_kg:
      v: null
      u: kg
      d: Engine mass when mass_method = user
      s: User
      t: user
    gimbal_method:
      v: mer
      u: '-'
      d: mer | user | none
      s: Book Table 8.9 row 2
      t: reference
    gimbal_user_per_engine_kg:
      v: null
      u: kg
      d: Gimbal mass when gimbal_method = user
      s: User
      t: user
    throttle_min_fraction:
      v: 1.0
      u: '-'
