    u: '-'
    d: Fuel (key into propellant library)
    s: User
    t: user
  oxidizer:
    v: LOX
    u: '-'
    d: Oxidizer (key into propellant library)
    s: User
    t: user
  mixture_ratio_OF:
    v: 2.6
    u: '-'
    d: O/F = m_ox / m_fuel (book's f = m_fuel/m_ox = 1/OF)
    s: Assumed RP-1/LOX O/F (not published for Rutherford in sources)
    t: assumed
  residual_fraction:
    v: 0.02
    u: '-'
    d: Residual propellant fraction of mission propellant (stays on board at burnout)
    s: Book Table 8.3 (p.482)
