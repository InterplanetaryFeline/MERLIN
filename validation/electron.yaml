    u: kg
    d: Stage separation hardware (jettisoned with this stage)
    s: Assumed
    t: assumed
  other_equipment_mass_kg:
    v: 20.0
    u: kg
    d: Other equipment (power, harness extras, TPS) lumped
    s: Assumed (batteries, harness)
    t: assumed
  structure_mass_factor:
    v: 0.8
    u: '-'
    d: Multiplier on tank-structure and unpressurised-structure MERs (1 = metallic as in the book MERs; book p.498 suggests ~0.8 for composites)
    s: 'Book p.498: ~20 % mass reduction for composites (Electron is carbon-composite)'
    t: reference
  inert_mass_margin_fraction:
    v: 0.1
    u: '-'
    d: Mass-growth margin on summed dry components (single margin, applied once)
    s: Assumed (book Example 2 reports 22-25% positive margin, p.506)
    t: assumed
  avionics_mass_override_kg:
