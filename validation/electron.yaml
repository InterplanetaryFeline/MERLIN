# AUTO-GENERATED by tools/make_validation_cases.py - real-vehicle validation case. Sources are in each leaf's 's' field.
meta:
  name: VAL-Electron
  description: Rocket Lab Electron (LOX/RP-1, carbon composite), 300 kg to 500 km LEO
mission:
  payload_mass_kg:
    v: 300.0
    u: kg
    d: Payload mass delivered to the injection orbit (excludes adapter and fairing)
    s: 'rocketlabusa.com/electron: payload to LEO 300 kg (500 km per orbitalradar.com Electron page)'
    t: reference
  payload_adapter_mass_kg:
    v: null
    u: kg
    d: Payload adapter / PAF mass; null = use MER 0.0755 m_PL + 50
    s: Book Table 8.8 row 4 (p.495) when null
    t: reference
  payload_envelope_diameter_m:
    v: 1.0
    u: m
    d: Payload static envelope diameter
    s: 'Assumed: Electron payload diameter ~1.08 m (eoportal) inside a 1.2 m fairing'
    t: assumed
  payload_envelope_length_m:
    v: 1.0
    u: m
    d: Payload static envelope cylindrical length
    s: Assumed envelope length
    t: assumed
  delta_v_override_mps:
    v: null
    u: m/s
    d: If non-null, replaces the whole budget total (testing / design studies only)
    s: User override
    t: user
  report_apogee_maneuver:
    v: false
    u: '-'
    d: Report GTO->GEO apogee maneuver as informational line
    s: Option
    t: user
  orbit:
    type:
      v: LEO
      u: '-'
      d: LEO | SSO | GTO | GEO_VIA_GTO | GEO_DIRECT | CUSTOM
      s: User requirement
      t: user
    perigee_altitude_km:
      v: 500.0
      u: km
      d: Injection (perigee) altitude
      s: 'orbitalradar.com: ''Payload to LEO (500 km) ~300 kg'''
      t: reference
    apogee_altitude_km:
      v: null
      u: km
      d: Apogee altitude (null for circular orbits)
      s: User requirement
      t: user
    eccentricity:
      v: null
      u: '-'
      d: Eccentricity (alternative to apogee altitude)
      s: User requirement
      t: user
    inclination_deg:
      v: 45.0
      u: deg
      d: 'Orbital inclination (ignored for SSO: computed)'
      s: Assumed (inclination of the 300 kg figure not stated)
      t: assumed
  launch_site:
    site:
      v: null
      u: '-'
      d: Launch site from config/launch_sites.yaml; fills latitude. null = Custom, type a latitude below
      s: User choice; the latitude it fills is registered separately against the library's own source
      t: user
    latitude_deg:
      v: 39.26
      u: deg
      d: Launch site geodetic latitude (spherical Earth assumed)
      s: Rocket Lab LC-1, Mahia (39.26 deg S; sign irrelevant to speed)
      t: reference
    longitude_deg:
      v: null
      u: deg
      d: Launch site longitude, east positive; used only to place impact points on a map. null = unknown, which gives drop-zone distances but no coordinates
      s: Not stated; type one to place drop zones on a map
      t: user
    altitude_m:
      v: 0.0
      u: m
      d: Launch site altitude (recorded; not used in v1 performance model)
      s: User
      t: user
    azimuth_deg:
      v: null
      u: deg
      d: Launch azimuth from North; null = computed from inclination (sin b = cos i / cos lat)
      s: Computed when null
      t: assumed
    include_earth_rotation:
      v: true
      u: '-'
      d: Credit Earth rotation (justified for a direct eastward-type ascent from a fixed site)
      s: Book Example 3.9 (p.185) method
      t: reference
  losses:
    model:
      v: book_penalty
      u: '-'
      d: 'Ascent-loss model: book_penalty (Book Eq. 3:36-3:38 regression, lumped gravity+drag+steering+propulsion) | user (explicit values below)'
      s: Book pp.181-182 (RMS error ~260 m/s for LEO)
      t: reference
    staging_delay_s:
      v: 3.0
      u: s
      d: 'Ignition/staging delay added to ascent time per stage separation (book: delays ''should be considered'')'
      s: Assumed; book p.181 says delays should be considered
      t: assumed
    gravity_mps:
      v: 1200.0
      u: m/s
      d: Gravity-loss estimate (used only when model = user)
      s: Assumed; Table 3.4 range 1,150-1,534 m/s (p.180)
      t: assumed
    drag_mps:
      v: 100.0
      u: m/s
      d: Drag-loss estimate (model = user only)
      s: Assumed; Table 3.4 range 40-156 m/s (p.180)
      t: assumed
    steering_mps:
      v: 150.0
      u: m/s
      d: Steering-loss estimate (model = user only)
      s: Assumed; Table 3.4 range 33-358 m/s (p.180)
      t: assumed
    other_allowance_mps:
      v: 0.0
      u: m/s
      d: Other explicit allowances on top of the loss model
      s: None assumed (avoid double counting with margin)
      t: assumed
    design_margin_fraction:
      v: 0.0
      u: '-'
      d: 'Delta-v design margin as fraction of subtotal (applied once). Book regression RMS error is ~260 m/s (~3 %): consider 0.03'
      s: Set to 0 so the book regression is reported unmodified; user may add margin
      t: assumed
    ascent_time_override_s:
      v: null
      u: s
      d: Powered ascent time fed to the loss regression; null = the sum of the sized burn times. Set it when a low-thrust upper stage puts that sum outside the regression's range - the sizing loop refuses to extrapolate and
        names this field in the error
      s: Null = computed from the sized burn times. Book pp.181-182 fitted the regression to ordinary ascents
      t: user
  atmosphere_model:
    v: book_exponential
    u: '-'
    d: book_exponential (Eqs. 6:50/6:53, h0 = 7.64 km, with US76 temperature for the speed of sound) | us76 (the 1976 standard throughout)
    s: Book pp.362-363
    t: reference
  vertical_rise_s:
    v: 10.0
    u: s
    d: Vertical climb before the pitch kick that starts the gravity turn; the book waits 'a few seconds until the vehicle climbs above ground objects' (p.369)
    s: Assumed; book Sec. 6.4.7
    t: assumed
  last_ascent_stage:
    v: null
    u: '-'
    d: Stop the ascent integration after this stage, for a vehicle whose upper stage restarts after a parking-orbit coast (null = fly every stage back to back)
    s: User
    t: user
  aerodynamics:
    drag_model:
      v: geometry
      u: '-'
      d: geometry (Cd built up from this vehicle's own shape, against Mach) | book_titan2 (Fig. 6.13 analytic Cd(M), one vehicle's curve) | table (your own Cd against Mach, in mach_table and cd_table) | constant (one Cd at
        every Mach, for hand checks)
      s: SUPPLEMENTARY - the book gives no geometry method and points to Missile DATCOM (p.358); build-up after Fleeman, Tactical Missile Design (2001) pp.23-24 and the OpenRocket technical documentation; measured in docs/DRAG.md
      t: assumed
    surface_roughness_m:
      v: 5.0e-05
      u: m
      d: Surface roughness height for the skin-friction term of drag_model 'geometry'. A painted or bare-metal skin with rivets, weld lands and insulation; rougher raises friction drag
      s: Assumed
      t: assumed
    nose_shape:
      v: cone
      u: '-'
      d: cone | ogive - shape of the fairing nose for drag_model 'geometry'. The drawing shows a cone either way; an ogive of the same length has less drag below Mach 1 and the same above
      s: Assumed, to match the conical nose the layout draws
      t: assumed
    nose_bluntness:
      v: 0.0
      u: '-'
      d: Diameter of a spherical nose tip as a fraction of the fairing diameter, for drag_model 'geometry' (0 = sharp). Real fairings are blunted, which adds drag (Fleeman p.24)
      s: Assumed
      t: assumed
    constant_cd:
      v: 0.29
      u: '-'
      d: Cd for drag_model 'constant'; the book's rule of thumb is that missile Cd is around 0.2 for much of the envelope (p.359)
      s: Book p.359
      t: reference
    mach_table:
      v:
      - 0.0
      - 0.8
      - 1.068
      - 1.5
      - 2.0
      - 3.0
      - 5.0
      - 8.0
      u: '-'
      d: Mach numbers for drag_model 'table', in rising order. Replace these and cd_table with your own data; Cd is interpolated between points and held constant beyond the first and last
      s: Placeholder - sample points of the book's Titan II curve, Fig. 6.13 p.361
      t: reference
    cd_table:
      v:
      - 0.29
      - 0.29
      - 0.558
      - 0.4243
      - 0.341
      - 0.2577
      - 0.191
      - 0.1535
      u: '-'
      d: Drag coefficient at each Mach number of mach_table, for drag_model 'table' (same number of entries)
      s: Placeholder - the book's Titan II curve, Fig. 6.13 p.361, evaluated at the mach_table points
      t: reference
    cna_overrides:
      v: null
      u: 1/rad
      d: 'Normal-force slope per tapering segment for the flight load cases, as {name fragment: CNa per radian}; null uses the slender-body 2/rad of book Table 9.7. Supply chart reads from Figs. 9.38-9.39 here when the vehicle
        is supersonic at max-q'
      s: User
      t: user
  cost_year:
    v: 2010
    u: year
    d: Year whose constant dollars the cost estimate is reported in. 2010 is the book's own reference year for all its TRANSCOST examples and the year of the bold NASA work-year value in Table 17.3; other years are escalated
      from it by Eq. 17.1 at 3.1 %/yr
    s: Book Sec. 17.6 and Table 17.3, p.1002
    t: reference
  pad_height_m:
    v: 0.0
    u: m
    d: Height of the stage-1 nozzle exit plane above the ground when the vehicle stands on its launch mount; the ground wind profile v = 9.5 h^0.2 is a function of height above the ground, so a tall mount raises the whole
      wind load (the book's Saturn V sits with its base at 4.16 m)
    s: Assumed; book Table 9.5 geometry (p.566)
    t: assumed
  wind:
    profile:
      v: book_amr_95
      u: '-'
      d: built-in name 'book_amr_95', or a path / glob / list of paths to CSV or Excel wind profiles (altitude_m and speed_mps columns, or km/ft and kt/km-h variants)
      s: Book Fig. 9.35, p.572
      t: reference
    kind:
      v: gust_envelope
      u: '-'
      d: gust_envelope = the data is already a worst-case envelope and is used as the gust speed (the book's AMR curve is one) | steady = the data is a mean or sounding profile and gust_increment_mps rides on top of it
      s: Book Sec. 9.1.6.3 step 4 (p.573) treats its envelope as the gust speed
      t: reference
    gust_increment_mps:
      v: 0.0
      u: m/s
      d: Gust speed added on top of a 'steady' profile. REQUIRED for kind = steady and refused if left at zero, because the book gives no increment for an arbitrary site and guessing one here would be indistinguishable from
        the answer being right. Ignored for a gust_envelope profile
      s: No book value for an arbitrary site
      t: assumed
fairing:
  diameter_m:
    v: 1.2
    u: m
    d: Fairing outer diameter (must equal upper-stage diameter in v1)
    s: 'rocketlabusa.com/electron: diameter 1.2 m'
    t: reference
  nose_length_over_D:
    v: 0.8
    u: '-'
    d: Conical nose length / diameter
    s: 'Assumed so total fairing ~2.5 m (eoportal: fairing length 2.5 m)'
    t: assumed
  axial_clearance_m:
    v: 0.2
    u: m
    d: Axial clearance added to payload envelope length
    s: Assumed
    t: assumed
  radial_clearance_m:
    v: 0.1
    u: m
    d: Radial clearance between envelope and fairing
    s: Assumed
    t: assumed
  material:
    v: composite
    u: '-'
    d: metal | composite (selects areal mass MER)
    s: 'rocketlabusa.com: carbon composite structure'
    t: reference
  jettison_at_stage_start:
    v: 2
    u: '-'
    d: Fairing is jettisoned at the START of this stage's burn
    s: Assumed; book Example 2 notes jettison shortly after stage-2 start (p.506)
    t: assumed
  mass_override_kg:
    v: null
    u: kg
    d: Override fairing mass (null = MER x area)
    s: User
    t: user
vehicle:
  paf_length_over_D:
    v: 0.25
    u: '-'
    d: Payload attach fitting height / upper-stage diameter
    s: Book Table 8.11 label 'PAF, h = D/4' (p.506)
    t: reference
  payload_adapter_method:
    v: auto
    u: '-'
    d: 'PAF mass model: mer (Table 8.8 row 4: 0.0755 m_PL + 50 kg) | fraction (0.15 m_PL) | auto (fraction below the small-payload threshold)'
    s: 'Book 1st-ed. errata p.443: use m_PAF = 0.15 m_PL for smaller payloads (the Table 8.8 MER''s +50 kg constant does not scale down)'
    t: reference
  dv_allocation_mode:
    v: fractions
    u: '-'
    d: fractions | fixed
    s: User
    t: user
  optimise_dv_split:
    v: true
    u: '-'
    d: Replace the delta-v split below with the optimum before sizing, so the vehicle reported is the vehicle optimised. Off means the split is yours and is used as written. If no split gives a vehicle that sizes, yours is
      used and the page says so
    s: On by default since v1.1 at the owner's request; the published accuracy figures in docs/ACCURACY.md are for the optimised split
    t: assumed
  optimise_objective:
    v: glom
    u: '-'
    d: 'What to optimise towards when optimise_dv_split is on: glom (lightest vehicle) | cost (lowest development cost) | payload (most payload at the same lift-off mass)'
    s: User
    t: user
  dv_fractions:
    v:
    - 0.42
    - 0.58
    u: '-'
    d: What share of the total delta-v each stage provides. This is the staging decision - it sets how big each stage is. Entered as a percentage per stage in the GUI, and normalised to 100 % if it does not add up
    s: Assumed starting split; the runner also reports a GLOM-minimising split
    t: assumed
  dv_fixed_mps:
    v: null
    u: m/s
    d: Fixed per-stage delta-v (last may be null = remainder)
    s: User
    t: user
constraints:
  max_vehicle_length_m:
    v: 30.0
    u: m
    d: Maximum allowed overall length
    s: User
    t: user
  min_tw_liftoff:
    v: 1.2
    u: '-'
    d: Minimum liftoff thrust/weight (sea-level thrust)
    s: Assumed
    t: assumed
  max_accel_g:
    v: 6.0
    u: g
    d: Maximum axial acceleration at burnout (vacuum thrust)
    s: Assumed payload-environment limit
    t: assumed
  min_tw_upper:
    v: 0.4
    u: '-'
    d: Warn if upper-stage ignition T/W is below this
    s: Assumed (book Example 1 uses 0.7 on stage 2, p.482)
    t: assumed
  max_dynamic_pressure_Pa:
    v: 44000.0
    u: Pa
    d: 'Dynamic pressure the vehicle may be flown to. Constrains the ascent optimisation (--optimise-ascent); not checked against the baseline trajectory. The default is what the book''s generic launch vehicle reaches, NOT
      a certified limit: Fig. 9.36 shows 920 lbf/ft2 = 44.0 kPa, against Saturn V 35.2 kPa (Sec. 9.2), the Shuttle''s high-q profile 695 lbf/ft2 = 33.3 kPa (p.405) and Pegasus 66.9 kPa, which the book flags as costing 322
      m/s of drag loss (p.414). Replace it with your vehicle''s number'
    s: Book Fig. 9.36, p.572 (observed value, not a limit)
    t: assumed
  max_q_alpha_Pa_deg:
    v: 331800.0
    u: Pa deg
    d: 'Peak of dynamic pressure times angle of attack, the parameter that sets air loads. Constrains the ascent optimisation. The default is the book''s generic launch vehicle in Fig. 9.36: (q alpha)max = 6,930 lbf deg/ft2
      = 331.8 kPa deg. Again an observed value, not a certified limit'
    s: Book Fig. 9.36, p.572 (observed value, not a limit)
    t: assumed
stages:
- name:
    v: Electron stage 1
    u: '-'
    d: Stage label
    s: label
    t: user
  fuel:
