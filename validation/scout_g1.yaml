      u: '-'
      d: Sea-level lift-off T/W (tw_ignition mode)
      s: Not used
      t: user
    thrust_vac_total_N:
      v: null
      u: N
      d: Total vacuum thrust (fixed_thrust mode)
      s: Not used
      t: user
    burn_time_s:
      v: 72.0
      u: s
      d: Motor action time (burn_time mode)
      s: 'Development of the Algol III Solid Rocket Motor for Scout, SAE 710765 / NTRS 19720026595: 45 in. diameter, L/D 8:1, average 100,000 lbf, 72 s action time, 17 % aluminized polybutadiene. Isp DERIVED, not published:
        100,000 lbf x 72 s / (12,817 kg x g0) = 254.8 s vacuum; sea-level value assumed 10 % lower'
      t: reference
    isp_vac_s:
      v: 254.8
      u: s
      d: Vacuum specific impulse
      s: 'Development of the Algol III Solid Rocket Motor for Scout, SAE 710765 / NTRS 19720026595: 45 in. diameter, L/D 8:1, average 100,000 lbf, 72 s action time, 17 % aluminized polybutadiene. Isp DERIVED, not published:
        100,000 lbf x 72 s / (12,817 kg x g0) = 254.8 s vacuum; sea-level value assumed 10 % lower'
      t: assumed
    isp_sl_s:
      v: 229.0
      u: s
      d: Sea-level specific impulse
      s: 'Development of the Algol III Solid Rocket Motor for Scout, SAE 710765 / NTRS 19720026595: 45 in. diameter, L/D 8:1, average 100,000 lbf, 72 s action time, 17 % aluminized polybutadiene. Isp DERIVED, not published:
        100,000 lbf x 72 s / (12,817 kg x g0) = 254.8 s vacuum; sea-level value assumed 10 % lower'
      t: assumed
    isp_effective_mode:
      v: weighted
      u: '-'
      d: vacuum | weighted | user
      s: Book Eq. 4:18 weighting for an atmospheric stage; vacuum Isp for upper stages
      t: assumed
    isp_sl_weight:
      v: 0.3333333333333333
      u: '-'
      d: Sea-level weight when mode = weighted
      s: Book Eq. 4:18 (p.225)
      t: reference
    isp_effective_user_s:
      v: null
      u: s
      d: Explicit effective Isp
      s: Not used
      t: user
    expansion_ratio:
      v: 8.5
      u: '-'
      d: Nozzle area expansion ratio
      s: Assumed (low-expansion first-stage nozzle)
      t: assumed
    chamber_pressure_Pa:
      v: 4600000.0
      u: Pa
      d: Average chamber pressure
      s: Assumed (typical 4-7 MPa for large SRMs)
      t: assumed
    cstar_mps:
      v: 1577.0
      u: m/s
      d: Characteristic exhaust velocity
      s: 'Book Table 4.7 row 3 (p.238): c* = 1,577 m/s'
      t: reference
    nozzle_geometry_method:
      v: book_mer
      u: '-'
      d: book_mer (Eqs. 8:28/8:30) | user
      s: Book Sec. 8.7.7 (pp.507-511)
      t: reference
    exit_diameter_m:
      v: null
      u: m
      d: Nozzle exit diameter
      s: Computed by book_mer
      t: user
    nozzle_length_m:
      v: null
      u: m
      d: Protruding nozzle length
      s: Computed by book_mer
      t: user
    embed_fraction:
      v: 0.3
      u: '-'
      d: Fraction of the nozzle submerged in the aft dome/skirt
      s: Assumed
      t: assumed
    casing_mass_method:
      v: book_steel
