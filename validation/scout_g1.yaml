  structure_mass_factor:
    v: 1.0
    u: '-'
    d: Multiplier on unpressurised-structure MERs
    s: Book p.498 (~0.8 for composites); 1.0 = metallic
    t: reference
  inert_mass_margin_fraction:
    v: 0.1
    u: '-'
    d: Mass-growth margin on dry components
    s: Assumed
    t: assumed
  avionics_mass_override_kg:
    v: null
    u: kg
    d: Avionics mass for this stage, overriding the Table 8.8 step relationship. null = use the relationship
    s: User
    t: user
  max_length_m:
    v: null
    u: m
    d: Maximum length allowed for this stage; the design is refused if it exceeds this. null = no limit
    s: User
    t: user
  layout:
    aft_skirt_over_D:
      v: 0.3
      u: '-'
      d: Aft skirt length / D
      s: Assumed
      t: assumed
    fwd_skirt_over_D:
      v: 0.2
      u: '-'
      d: Forward skirt length / D
      s: Assumed
      t: assumed
    interstage_min_length_m:
      v: 0.5
      u: m
      d: Minimum interstage length
      s: Assumed
      t: assumed
    interstage_clearance_m:
      v: 0.3
      u: m
      d: Axial clearance between upper-stage nozzle and lower-stage forward end
      s: Assumed
      t: assumed
    interstage_half_angle_deg:
      v: 15.0
      u: deg
      d: Maximum cone half-angle for diameter transitions
      s: Assumed
      t: assumed
  propellant_combination:
    v: null
    u: '-'
    d: Name a pair from assumptions.propellant_combinations and it fills the fuel, the oxidiser and the mixture ratio; leave empty to set them yourself
    s: Propellant combination library
    t: user
  stage_type:
    v: solid
    u: '-'
    d: liquid | solid
    s: 'Published: solid motor stage'
    t: reference
  propellant:
    v: PBAN_AP_AL
    u: '-'
    d: Key into the solid-propellant library
    s: Book Table 4.7 (p.238)
    t: reference
  motor:
    name:
      v: Algol IIIA
      u: '-'
      d: Motor label
      s: 'Development of the Algol III Solid Rocket Motor for Scout, SAE 710765 / NTRS 19720026595: 45 in. diameter, L/D 8:1, average 100,000 lbf, 72 s action time, 17 % aluminized polybutadiene. Isp DERIVED, not published:
        100,000 lbf x 72 s / (12,817 kg x g0) = 254.8 s vacuum; sea-level value assumed 10 % lower'
      t: reference
    n_motors:
      v: 1
      u: '-'
      d: One casing per serial solid stage
      s: Book Sec. 8.5 (p.486)
      t: reference
    thrust_mode:
      v: burn_time
      u: '-'
      d: tw_ignition | fixed_thrust | burn_time
      s: Modelling choice
      t: user
    thrust_to_weight_ignition:
